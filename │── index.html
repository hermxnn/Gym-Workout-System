<!DOCTYPE html>
<html>
<head>
  <title>Gym Booking System</title>
</head>
<body>

<h2>Workout Booking System</h2>

<input id="email" placeholder="Email"><br>
<input id="first" placeholder="First Name"><br>
<input id="last" placeholder="Last Name"><br>
<input id="phone" placeholder="Phone"><br>
<input id="date" placeholder="Date (YYYY-MM-DD)"><br>
<input id="time" placeholder="Time (ex: 3:15 PM)"><br>
<input id="trainer" placeholder="Trainer"><br>

<button onclick="book()">Book Workout</button>

<p id="msg"></p>

<script>
let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

function book() {
  let email = document.getElementById("email").value.trim();
  let first = document.getElementById("first").value.trim();
  let last = document.getElementById("last").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let date = document.getElementById("date").value.trim();
  let time = document.getElementById("time").value.trim();
  let trainer = document.getElementById("trainer").value.trim();

  if (!email || !first || !last || !phone || !date || !time) {
    return show("Missing required fields");
  }

  if (!email.includes("@")) {
    return show("Invalid email");
  }

  // duplicate person check
  if (appointments.some(a => a.first === first && a.last === last)) {
    return show("This person already has a booking");
  }

  // time conflict check
  if (appointments.some(a =>
    a.date === date && a.time === time && a.trainer === trainer
  )) {
    return show("Time slot already booked");
  }

  appointments.push({ email, first, last, phone, date, time, trainer });
  localStorage.setItem("appointments", JSON.stringify(appointments));

  show("Workout booked successfully!");
}

function show(msg) {
  document.getElementById("msg").innerText = msg;
}
</script>

</body>
</html>
