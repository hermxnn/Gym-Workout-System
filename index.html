<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grambling Tigers Workout Palace</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: radial-gradient(circle at top, #000000, #0b0b0b);
  color: white;
}

header {
  text-align: center;
  padding: 20px 10px;
  font-family: 'Anton', sans-serif;
  font-size: 42px;
  letter-spacing: 2px;
  color: #ffcc00;
  text-shadow: 0 0 15px #ff0000;
}

.subtext {
  text-align: center;
  margin-top: -10px;
  opacity: 0.9;
  color: #ff4444;
}

.tagline {
  text-align: center;
  margin-top: 8px;
  color: #ffcc00;
  font-style: italic;
}

.container {
  max-width: 650px;
  margin: 30px auto;
  background: rgba(255,255,255,0.05);
  padding: 25px;
  border-radius: 20px;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 25px rgba(255,0,0,0.2);
}

input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  color: white;
}

input:focus {
  box-shadow: 0 0 10px #ffcc00;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #ffcc00, #ff0000);
  color: black;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  transform: scale(1.03);
  box-shadow: 0 0 20px #ffcc00;
}

#msg {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

.glow {
  height: 2px;
  background: linear-gradient(90deg, transparent, #ffcc00, #ff0000, transparent);
  margin: 15px 0;
}

/* NEW IMAGES */
.top-image {
  display: block;
  margin: 20px auto;
  width: 180px;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(255,204,0,0.4);
}

.bottom-image {
  display: block;
  margin: 25px auto;
  width: 220px;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(255,0,0,0.4);
}

.icons {
  text-align: center;
  font-size: 26px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<header>GRAMBLING TIGERS WORKOUT PALACE</header>

<div class="icons">🏋️ 💪 🐅</div>

<div class="subtext">Train like a Tiger. Build like a Champion.</div>
<div class="tagline">Grambling, Where Everybody can be Somebody</div>

<!-- TOP IMAGE -->
<img class="top-image" src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b" alt="Gym">

<div class="container">

  <div class="glow"></div>

  <input id="email" placeholder="Email">
  <input id="first" placeholder="First Name">
  <input id="last" placeholder="Last Name">
  <input id="phone" placeholder="Phone Number">
  <input id="date" placeholder="Workout Date (YYYY-MM-DD)">
  <input id="time" placeholder="Time (e.g. 5:30 PM)">
  <input id="trainer" placeholder="Trainer">

  <button onclick="book()">🔥 Book Workout</button>

  <div id="msg"></div>
</div>

<!-- BOTTOM IMAGE -->
<img class="bottom-image" src="https://images.unsplash.com/photo-1558611848-73f7eb4001ab" alt="Workout">

<script>
let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

function book() {
  let email = document.getElementById("email").value.trim();
  let first = document.getElementById("first").value.trim();
  let last = document.getElementById("last").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let date = document.getElementById("date").value.trim();
  let time = document.getElementById("time").value.trim();
  let trainer = document.getElementById("trainer").value.trim();
  let msg = document.getElementById("msg");

  if (!email || !first || !last || !phone || !date || !time || !trainer) {
    msg.innerText = "⚠ Please fill out all fields";
    msg.style.color = "#ffcc00";
    return;
  }

  if (!email.includes("@")) {
    msg.innerText = "⚠ Invalid email";
    msg.style.color = "#ff0000";
    return;
  }

  if (appointments.some(a => a.email === email || a.phone === phone)) {
    msg.innerText = "⚠ This email or phone number is already used";
    msg.style.color = "#ff0000";
    return;
  }

  let selectedDate = new Date(date);
  let minDate = new Date("2026-05-06");
  let maxDate = new Date("2026-12-31");

  if (selectedDate < minDate || selectedDate > maxDate) {
    msg.innerText = "⚠ Date must be between May 6, 2026 and Dec 31, 2026";
    msg.style.color = "#ff0000";
    return;
  }

  if (appointments.some(a => a.date === date && a.time === time && a.trainer === trainer)) {
    msg.innerText = "⚠ Time slot already taken";
    msg.style.color = "#ff0000";
    return;
  }

  appointments.push({ email, first, last, phone, date, time, trainer });
  localStorage.setItem("appointments", JSON.stringify(appointments));

  msg.innerText = "🏆 Workout Booked Successfully!";
  msg.style.color = "#ffcc00";

  let subject = "Workout Booking Confirmation";
  let body = `Hello ${first}, your workout is booked on ${date} at ${time} with ${trainer}.`;

  window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  document.querySelectorAll("input").forEach(i => i.value = "");
}
</script>

</body>
</html>
